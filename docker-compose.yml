services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memorybook_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./:/var/www/html
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/zz-memorybook.conf:ro
    depends_on:
      - db
    networks:
      - memorybook_net

  web:
    image: nginx:alpine
    container_name: memorybook_web
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - memorybook_net

  db:
    image: postgres:16-alpine
    container_name: memorybook_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: memorybook_db
      POSTGRES_USER: memorybook_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - memorybook_pgdata:/var/lib/postgresql/data
    networks:
      - memorybook_net

volumes:
  memorybook_pgdata:

networks:
  memorybook_net:
    name: memorybook_net
    driver: bridge
